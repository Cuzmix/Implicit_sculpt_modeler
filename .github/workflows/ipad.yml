name: iPad build

# Builds Sculpt.ipa on GitHub's macOS runner (./build.sh ios): unsigned, for AltStore to sign
# on the iPad, or with "testflight" ticked a store build signed with the distribution
# certificate and sent to App Store Connect for TestFlight (README "iPad", the secrets it
# names). It runs only when started by hand (Actions > iPad build > Run workflow), so the
# macOS minutes a private repository pays for go only to builds someone asked for.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign for the App Store and send to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read the pins
        run: |
          grep -E '^(ODIN|SDL|UFBX)_TAG=' scripts/versions.env >> "$GITHUB_ENV"
          grep -E '^IOS_MIN=' build.sh >> "$GITHUB_ENV"

      - name: Odin, the pinned release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-macos-arm64-$ODIN_TAG.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin" deps
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          mv "$RUNNER_TEMP"/odin/odin-macos-arm64-* deps/odin
          deps/odin/odin version

      - name: SDL source, the pinned tag
        run: git clone -q --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL.git deps/sdl3-src

      # ufbx for FBX import, which build.sh ios compiles with the app's shim.
      - name: ufbx source, the pinned tag
        run: git clone -q --depth 1 -b "$UFBX_TAG" https://github.com/ufbx/ufbx.git deps/ufbx-src

      # GitHub lets a branch restore its own caches and the default branch's (odin-sculpt), not
      # another branch's: a run on odin-sculpt after the SDL pin, IOS_MIN, scripts/sdl_ios.sh
      # or the shaders change saves them for every branch (README "iPad").
      - name: SDL built for the iPad, cached
        uses: actions/cache@v4
        with:
          path: build/ios/sdl
          key: sdl-ios-${{ env.SDL_TAG }}-${{ env.IOS_MIN }}-${{ hashFiles('scripts/sdl_ios.sh') }}
      # build.sh checks again only the shaders whose source or compiler changed (their .sum
      # files), so a cache of another set of shaders still spares the unchanged ones.
      - name: Metal shaders checked, cached
        uses: actions/cache@v4
        with:
          path: build/ios/msl
          key: msl-ios-${{ hashFiles('src/render/shaders/*.msl') }}
          restore-keys: msl-ios-

      - name: Build Sculpt.ipa
        if: ${{ !inputs.testflight }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # A developer build: Input diagnostics is reachable (README "Input diagnostics"),
          # and its reports name the commit.
          SCULPT_DIAGNOSTICS: "1"
        run: SCULPT_VERSION="g${GITHUB_SHA::7}" ./build.sh ios

      # The store build: the distribution certificate goes into a keychain of the run's own,
      # deleted with the runner, and the profile and API key into files of the run's temp
      # folder. Every secret is the repository's (Settings > Secrets and variables > Actions).
      - name: Signing keychain, profile and API key
        if: ${{ inputs.testflight }}
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in CERT_P12 CERT_PASSWORD PROFILE ASC_KEY_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || { echo "missing secret for $name (README \"iPad\")"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "no Apple Distribution identity in the certificate"; exit 1; }
          echo "SCULPT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SCULPT_PROFILE=$RUNNER_TEMP/appstore.mobileprovision" >> "$GITHUB_ENV"

      # TestFlight and the App Store want each upload's build number higher than the last:
      # the run number grows with every run of this workflow.
      - name: Build and send to TestFlight
        if: ${{ inputs.testflight }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          SCULPT_VERSION="g${GITHUB_SHA::7}" ./build.sh ios
          ./build.sh iosupload

      - uses: actions/upload-artifact@v4
        with:
          name: Sculpt-ipa
          path: build/ios/Sculpt.ipa
          if-no-files-found: error
          retention-days: 14
