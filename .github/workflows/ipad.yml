name: iPad build

# Builds an unsigned Sculpt.ipa on GitHub's macOS runner (./build.sh ios) for AltStore to
# sign on the iPad. It runs only when started by hand (Actions > iPad build > Run workflow),
# so the macOS minutes a private repository pays for go only to builds someone asked for.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read the pins
        run: |
          grep -E '^(ODIN|SDL|UFBX)_TAG=' scripts/versions.env >> "$GITHUB_ENV"
          grep -E '^IOS_MIN=' build.sh >> "$GITHUB_ENV"

      - name: Odin, the pinned release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-macos-arm64-$ODIN_TAG.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin" deps
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          mv "$RUNNER_TEMP"/odin/odin-macos-arm64-* deps/odin
          deps/odin/odin version

      - name: SDL source, the pinned tag
        run: git clone -q --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL.git deps/sdl3-src

      # ufbx for FBX import, which build.sh ios compiles with the app's shim.
      - name: ufbx source, the pinned tag
        run: git clone -q --depth 1 -b "$UFBX_TAG" https://github.com/ufbx/ufbx.git deps/ufbx-src

      # GitHub lets a branch restore its own caches and the default branch's (odin-sculpt), not
      # another branch's: a run on odin-sculpt after the SDL pin, IOS_MIN, scripts/sdl_ios.sh
      # or the shaders change saves them for every branch (README "iPad").
      - name: SDL built for the iPad, cached
        uses: actions/cache@v4
        with:
          path: build/ios/sdl
          key: sdl-ios-${{ env.SDL_TAG }}-${{ env.IOS_MIN }}-${{ hashFiles('scripts/sdl_ios.sh') }}
      # build.sh checks again only the shaders whose source or compiler changed (their .sum
      # files), so a cache of another set of shaders still spares the unchanged ones.
      - name: Metal shaders checked, cached
        uses: actions/cache@v4
        with:
          path: build/ios/msl
          key: msl-ios-${{ hashFiles('src/render/shaders/*.msl') }}
          restore-keys: msl-ios-

      - name: Build Sculpt.ipa
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # A developer build: Input diagnostics is reachable (README "Input diagnostics"),
          # and its reports name the commit.
          SCULPT_DIAGNOSTICS: "1"
        run: SCULPT_VERSION="g${GITHUB_SHA::7}" ./build.sh ios

      - uses: actions/upload-artifact@v4
        with:
          name: Sculpt-ipa
          path: build/ios/Sculpt.ipa
          if-no-files-found: error
          retention-days: 14
