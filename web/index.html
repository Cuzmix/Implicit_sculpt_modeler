<!DOCTYPE html>
<!-- The web version's page (README "Web"): one full-window canvas the whole app draws into
     with WebGPU, its panels included, as on the desktop. scripts/web_build.py copies it
     into build/web/site beside sculpt.wasm, odin.js, wgpu.js and sdl_web.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sculpt</title>
<style>
	:root { --bg: #15171c; --text: #e7e9ee; --muted: #9aa0ad; color-scheme: dark; }
	html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
		font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
	#viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
		-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; outline: none; }
	#note, #failure { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
	#note { color: var(--muted); pointer-events: none; }
	#failure { display: none; background: var(--bg); font-size: 15px; }
	#failure div { max-width: min(720px, 100%); }
	#failure pre { margin: 16px 0 0; padding: 12px; text-align: left; white-space: pre-wrap; word-break: break-word;
		font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); background: #0c0d10; border-radius: 6px;
		-webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<canvas id="viewport" tabindex="0"></canvas>
<div id="note">Loading Sculpt…</div>
<div id="failure"><div></div></div>

<script src="odin.js"></script>
<script src="wgpu.js"></script>
<script src="sdl_web.js"></script>
<script>
"use strict";
const canvas = document.getElementById("viewport");
const note = document.getElementById("note");

// The last lines the page printed, shown under a failure: an Odin panic prints its message
// and place just before the wasm traps, and WebGPU's errors are logged, but a tablet's
// browser has no console to read them in.
const recent = [];
for (const level of ["log", "warn", "error"]) {
	const original = console[level].bind(console);
	console[level] = (...args) => {
		// odin.js prints errors as ("%c" + text, style): the style is not part of the line.
		const styled = typeof args[0] === "string" && args[0].startsWith("%c");
		const parts = styled ? [args[0].slice(2), ...args.slice(2)] : args;
		const text = parts.map(String).join(" ").trim();
		if (text) {
			recent.push(text);
			if (recent.length > 12) recent.shift();
			live(text);
		}
		original(...args);
	};
}

// Every line also goes to the development server as it is printed, with the wasm memory's
// size twice a second, so a tab the browser kills (Safari's "A problem repeatedly occurred",
// which leaves no page to report from) still shows on the computer how far it got and how
// large it grew. Any other host refuses the posts, and they stop after the first refusal.
const streamed = [];
let streaming = true;
let started = performance.now();
function live(text) {
	if (streaming) streamed.push(`${((performance.now() - started) / 1000).toFixed(2)}s ${text}`);
}
function flush() {
	if (!streaming || streamed.length === 0) return;
	const body = streamed.splice(0).join("\n");
	fetch("log", { method: "POST", body, keepalive: true }).then((r) => { if (!r.ok) streaming = false; }).catch(() => { streaming = false; });
}
setInterval(flush, 250);
live(`page: ${navigator.userAgent}`);
function stage(name) { live(`page: ${name}`); flush(); }
let watched_memory = null;
setInterval(() => {
	if (watched_memory) live(`page: wasm memory ${(watched_memory.buffer.byteLength / 1048576).toFixed(0)} MB, GPU ${(gpu_bytes / 1048576).toFixed(0)} MB in ${gpu_objects} buffers and textures, ${gpu_submits} submits`);
}, 500);

// What the app holds on the GPU, which a tablet's browser counts against the tab: every
// buffer and texture made and destroyed through WebGPU, by its size (a texture's by its
// format, samples, layers and mip chain), with each one of 16 MB or more named as it comes.
let gpu_bytes = 0, gpu_objects = 0, gpu_submits = 0;
const gpu_sizes = new WeakMap();
const FORMAT_BYTES = { r8unorm: 1, r8uint: 1, r8snorm: 1, rg8unorm: 2, r16float: 2, r16uint: 2, depth16unorm: 2,
	rgba16float: 8, rg32float: 8, rg32uint: 8, rgba16uint: 8, "depth32float-stencil8": 8,
	rgba32float: 16, rgba32uint: 16 };
function texture_bytes(d) {
	const size = Array.isArray(d.size) ? { width: d.size[0], height: d.size[1] || 1, depthOrArrayLayers: d.size[2] || 1 } : d.size;
	const per = FORMAT_BYTES[d.format] || 4;
	let total = 0, w = size.width, h = size.height || 1;
	const layers = size.depthOrArrayLayers || 1;
	for (let level = 0; level < (d.mipLevelCount || 1); level += 1) {
		total += Math.max(1, w) * Math.max(1, h) * layers * per;
		w >>= 1; h >>= 1;
	}
	return total * (d.sampleCount || 1);
}
function gpu_track(object, bytes, what) {
	gpu_sizes.set(object, bytes);
	gpu_bytes += bytes; gpu_objects += 1;
	if (bytes >= 16 * 1048576) live(`page: GPU ${what} ${(bytes / 1048576).toFixed(0)} MB, now ${(gpu_bytes / 1048576).toFixed(0)} MB`);
	const destroy = object.destroy;
	object.destroy = function () {
		if (gpu_sizes.has(this)) { gpu_bytes -= gpu_sizes.get(this); gpu_objects -= 1; gpu_sizes.delete(this); }
		return destroy.call(this);
	};
	return object;
}
if (typeof GPUDevice !== "undefined") {
	const createBuffer = GPUDevice.prototype.createBuffer;
	GPUDevice.prototype.createBuffer = function (d) {
		return gpu_track(createBuffer.call(this, d), d.size, `buffer "${d.label || ""}"`);
	};
	// Each shader and pipeline as it is made, and the work queued since the last memory
	// line: a shader that crashes or hangs the browser's GPU process takes the tab with it,
	// and the last of these lines before the end names it.
	let shader_count = 0;
	const createShaderModule = GPUDevice.prototype.createShaderModule;
	GPUDevice.prototype.createShaderModule = function (d) {
		shader_count += 1;
		const first = (d.code.match(/@(compute|vertex|fragment)[^{]*fn\s+(\w+)/) || [])[2];
		live(`page: shader ${shader_count} "${d.label || ""}" ${d.code.length} chars, first entry ${first}`);
		return createShaderModule.call(this, d);
	};
	const pipeline_name = (d) => [d.label, d.vertex && d.vertex.entryPoint, d.fragment && d.fragment.entryPoint, d.compute && d.compute.entryPoint].filter((v) => v).join(" ");
	for (const kind of ["createRenderPipeline", "createComputePipeline"]) {
		const make = GPUDevice.prototype[kind];
		GPUDevice.prototype[kind] = function (d) {
			live(`page: ${kind} ${pipeline_name(d)}`);
			return make.call(this, d);
		};
		const make_async = GPUDevice.prototype[kind + "Async"];
		if (make_async) GPUDevice.prototype[kind + "Async"] = function (d) {
			live(`page: ${kind}Async ${pipeline_name(d)}`);
			return make_async.call(this, d);
		};
	}
	// The scene preview's copy back from the GPU, and when it lands.
	const mapAsync = GPUBuffer.prototype.mapAsync;
	GPUBuffer.prototype.mapAsync = function (mode, offset, size) {
		const bytes = this.size;
		live(`page: mapAsync ${(bytes / 1048576).toFixed(1)} MB`);
		return mapAsync.call(this, mode, offset, size).then(
			(v) => { live(`page: mapped ${(bytes / 1048576).toFixed(1)} MB`); return v; },
			(e) => { live(`page: map failed ${e && e.name}: ${e && e.message}`); throw e; });
	};
	const submit = GPUQueue.prototype.submit;
	GPUQueue.prototype.submit = function (buffers) {
		gpu_submits += 1;
		return submit.call(this, buffers);
	};
	const createTexture = GPUDevice.prototype.createTexture;
	GPUDevice.prototype.createTexture = function (d) {
		const s = Array.isArray(d.size) ? d.size : [d.size.width, d.size.height, d.size.depthOrArrayLayers];
		return gpu_track(createTexture.call(this, d), texture_bytes(d), `texture "${d.label || ""}" ${s.filter((v) => v).join("x")} ${d.format} x${d.sampleCount || 1} mips ${d.mipLevelCount || 1}`);
	};
}

function fail(message) {
	note.style.display = "none";
	const box = document.getElementById("failure");
	box.firstElementChild.textContent = message;
	if (recent.length > 0) {
		const log = document.createElement("pre");
		log.textContent = recent.join("\n");
		box.firstElementChild.appendChild(log);
	}
	box.style.display = "grid";
	report(message);
}

// The development server (scripts/web_build.py --serve) prints a report in its terminal, so
// what happened on a tablet can be read on the computer; any other host refuses it, unnoticed.
function report(message) {
	fetch("failure", { method: "POST", body: [navigator.userAgent, message, ...recent].join("\n") }).catch(() => { });
}

// Errors outside the app's own calls (a rejected promise in WebGPU's glue, a script error)
// stop nothing visibly, so they are kept with the log and reported.
window.addEventListener("error", (e) => { console.error(`script error: ${e.message} (${e.filename}:${e.lineno})`); report("script error"); });
window.addEventListener("unhandledrejection", (e) => { console.error(`unhandled rejection: ${e.reason && (e.reason.stack || e.reason)}`); report("unhandled rejection"); });
// A page still loading after ten seconds has hung somewhere that reports nothing: what it
// shows and its last lines go to the server too.
setTimeout(() => {
	if (getComputedStyle(note).display !== "none") report("still loading after 10 s");
}, 10000);

async function start() {
	if (!navigator.gpu) {
		fail("This browser has no WebGPU. Use a current Chrome, Edge or Safari, or Firefox 141 or later.");
		return;
	}
	// The wasm's memory: up to 4 GB where the browser allows it, 1 GB where it does not.
	let memory;
	for (const maximum of [65536, 16384]) {
		try { memory = new WebAssembly.Memory({ initial: 2048, maximum }); break; } catch (_) { }
	}
	watched_memory = memory;
	stage(`memory made, ${memory.buffer.byteLength / 1048576} MB`);
	// Odin's wgpu.js asks for a device with every limit named, undefined for the ones the app
	// leaves at their defaults. Chrome passes over those; Safari can refuse the whole request
	// (with an empty message) for an undefined value or a limit it does not know. So the
	// request keeps only the limits with values the adapter lists, and the features it has;
	// one still refused is logged with its name and asked again with no limits, so the page
	// either starts or says why.
	if (typeof GPUAdapter !== "undefined") {
		const requestDevice = GPUAdapter.prototype.requestDevice;
		GPUAdapter.prototype.requestDevice = async function (descriptor) {
			const asked = Object.assign({}, descriptor);
			if (asked.requiredLimits) {
				const limits = {};
				for (const [name, value] of Object.entries(asked.requiredLimits)) {
					if (value !== undefined && name in this.limits) limits[name] = value;
				}
				asked.requiredLimits = limits;
			}
			if (asked.requiredFeatures) asked.requiredFeatures = [...asked.requiredFeatures].filter((f) => f && this.features.has(f));
			try {
				stage(`device asked with limits ${JSON.stringify(asked.requiredLimits)} and features ${JSON.stringify(asked.requiredFeatures)}`);
				const device = await requestDevice.call(this, asked);
				stage(`device made: maxBufferSize ${device.limits.maxBufferSize}, maxStorageBufferBindingSize ${device.limits.maxStorageBufferBindingSize}`);
				return device;
			} catch (e) {
				console.warn(`WebGPU refused the device (${e && e.name}: ${e && e.message}); asking again without limits. Asked for ${JSON.stringify(asked.requiredLimits)}`);
				return await requestDevice.call(this, Object.assign({}, asked, { requiredLimits: undefined }));
			}
		};
	}
	const web = new SculptWeb.Web(canvas, memory, fail);
	// Each write the app makes to the page's files (an autosave among them) and each save of
	// them to IndexedDB, logged before it happens.
	const write = web.fs.changed.bind(web.fs);
	web.fs.changed = function (path) {
		const e = this.entries.get(path);
		if (e && !e.dir && (!this.dirty.has(path))) live(`page: file ${path} ${(e.size / 1048576).toFixed(2)} MB`);
		return write(path);
	};
	const save = web.fs.flush.bind(web.fs);
	web.fs.flush = function () {
		let bytes = 0;
		for (const path of this.dirty) { const e = this.entries.get(path); if (e && !e.dir) bytes += e.size; }
		stage(`saving ${this.dirty.size} files, ${(bytes / 1048576).toFixed(2)} MB, to IndexedDB`);
		return save();
	};
	// The files kept from earlier visits (settings, library, scenes), before the app reads them.
	await web.fs.open();
	stage("files opened");
	const mem = new odin.WasmMemoryInterface();
	mem.setIntSize(8); // js_wasm64p32: Odin's int is 64-bit
	mem.setMemory(memory);
	const gpu = new odin.WebGPUInterface(mem);
	const imports = odin.setupDefaultImports(mem, null, memory);
	imports.wgpu = gpu.getInterface();
	// Odin's wgpu.js asks for the adapter's info without passing it the adapter; the info
	// names the GPU in the app's About and stats.
	imports.wgpu.wgpuAdapterGetInfo = (adapter, info) => gpu.genericGetAdapterInfo(info, gpu.adapters.get(adapter).info);
	imports.wgpu.wgpuDeviceGetAdapterInfo = (device, info) => gpu.genericGetAdapterInfo(info, gpu.devices.get(device).adapterInfo);
	Object.assign(imports, web.imports());
	const response = await fetch("sculpt.wasm");
	const bytes = await response.arrayBuffer();
	stage(`wasm downloaded, ${(bytes.byteLength / 1048576).toFixed(1)} MB`);
	const { instance } = await WebAssembly.instantiate(bytes, imports);
	stage("wasm compiled");
	const ex = instance.exports;
	mem.setExports(ex);
	web.exports = ex;
	ex._start();
	stage("main ran; waiting for the GPU");

	// The app's run leaves its set-up by an exception at the frame loop (src/app/web.odin),
	// which is caught here and nowhere else; each later call is one frame.
	let last;
	function frame(now) {
		const dt = last === undefined ? 0 : (now - last) / 1000;
		last = now;
		let keep = true;
		const began = performance.now();
		try {
			keep = ex.step(dt);
			const took = performance.now() - began;
			if (took > 100) live(`page: a frame took ${took.toFixed(0)} ms`);
		} catch (e) {
			if (e !== SculptWeb.UNWIND) {
				console.error(e);
				fail("Sculpt stopped: " + e);
				return;
			}
			note.style.display = "none";
			canvas.focus();
			stage("set up; frames running");
		}
		if (keep) requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
}
start().catch((e) => { console.error(e); fail("Sculpt could not start: " + e); });
</script>
</body>
</html>
